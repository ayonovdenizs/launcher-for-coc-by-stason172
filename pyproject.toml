[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher-coc"
dynamic = ["version"]
description = "Лаунчер сборки S.T.A.L.K.E.R. Call of Chernobyl от stason172"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ayden" }]
keywords = ["stalker", "call-of-chernobyl", "launcher", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = [
    "Pillow>=10",
    "pytest>=8",
    "ruff>=0.6",
]
build = ["pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/ayonovdenizs/launcher-for-coc-by-stason172"
Releases = "https://github.com/ayonovdenizs/launcher-for-coc-by-stason172/releases"

[project.scripts]
launcher-coc = "launcher.app:main"

[tool.setuptools]
packages = ["launcher", "launcher.ui"]

[tool.setuptools.dynamic]
version = { attr = "launcher.VERSION" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # длинные строки в таблице стилей (QSS)
    "E501",
    # интерфейс и документация на русском: кириллица в строках — это норма
    "RUF001",
    "RUF002",
    "RUF003",
    # Qt-слоты с camelCase именами: enterEvent, paintEvent и т.п.
    "N802",
    "N815",
]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402", "T201"]
"launcher/app.py" = ["T201"]
"tests/*.py" = ["T201", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
