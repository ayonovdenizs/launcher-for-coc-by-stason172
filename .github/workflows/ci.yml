name: CI

# Проверки кода: быстрый линтер (ruff) и юнит-тесты.
# Запускается на каждый push и pull request.

on:
  push:
    branches: ["ayden", "main", "arena/**"]
  pull_request:
    branches: ["ayden", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка ruff
        run: python -m pip install ruff>=0.6
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format --check
        run: ruff format --check launcher launcher_coc.py tools tests

  tests:
    name: Тесты (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Библиотеки для headless-запуска Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libx11-xcb1
      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
          COC_NO_UPDATE_CHECK: "1"
        run: python -m pytest -q
